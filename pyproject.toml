[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-forecast"
version = "0.1.0"
description = "Daily demand forecasting with calibrated uncertainty and a newsvendor capacity decision"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "lightgbm",
    "sqlalchemy",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = ["pytest"]
notebooks = ["jupyter", "matplotlib", "holidays", "statsforecast"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
