[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-forecast"
version = "0.1.0"
description = "Daily demand forecasting with calibrated uncertainty and a newsvendor capacity decision"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "lightgbm",
    "scikit-learn",
    "sqlalchemy",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
api = ["fastapi", "uvicorn"]
tracking = ["mlflow"]
notebooks = ["jupyter", "matplotlib", "holidays", "statsforecast"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The .generic. unit for NumPy timedelta:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
